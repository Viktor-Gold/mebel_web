name: Deploy Astro site to GitHub Pages

# События, при которых запускается workflow
on:
  push:
    branches: [ main ]       # запуск при пуше в main
  workflow_dispatch:          # возможность запускать вручную

# Разрешения для GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # -------------------------------
  # 1. Build (сборка проекта)
  # -------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      # Загружаем собранные файлы для деплоя
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # -------------------------------
  # 2. Deploy (развёртывание на Pages)
  # -------------------------------
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    environment:                 # ✅ ОБЯЗАТЕЛЬНО: environment для GitHub Pages
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4